name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The contract files are copied into every bundle at build time so the platforms cannot drift.
  # This checks the invariant that makes that safe: the shipped prompt must actually build.
  contract:
    name: Contract
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Prompt builds for every fidelity
        run: swift test --filter PromptBuilderTests

  swift:
    name: Swift core and macOS app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Unit tests
        # Integration tests are deliberately excluded: they call a paid API and fail when the
        # network does, which would make CI a coin flip rather than a signal.
        run: swift test --filter DoNotTypeCoreTests

      - name: Build the menu-bar app
        run: swift build -c release --product DoNotTypeMac

      - name: Build the evaluation harness
        run: swift build -c release --product dnt-eval

  windows-core:
    name: Windows core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # The core deliberately targets plain net10.0 with no Windows TFM, so it builds and tests
      # anywhere. That is what makes this job possible on Linux.
      - name: Core tests
        run: dotnet test windows/DoNotType.Core.Tests/DoNotType.Core.Tests.csproj

  windows-app:
    name: Windows app
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build the tray app
        run: dotnet build windows/DoNotType.App/DoNotType.App.csproj -c Release

      # Building a WinForms app proves nothing about whether it starts. This launches the real
      # tray app, waits, and fails if it is not still running -- which covers the tray icon, the
      # global hotkey install, settings load and the first window it opens. Screenshots are
      # uploaded so a person can look at what it actually drew.
      - name: Launch it and check it stays up
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Drawing, System.Windows.Forms
          New-Item -ItemType Directory -Force -Path shots | Out-Null

          $exe = "$PWD\windows\DoNotType.App\bin\Release\net10.0-windows\DoNotType.exe"
          $err = "$PWD\shots\stderr.txt"
          $proc = Start-Process $exe -PassThru -RedirectStandardError $err
          Start-Sleep -Seconds 25

          if ($proc.HasExited) {
            Write-Host "exit code $($proc.ExitCode)"
            if (Test-Path $err) { Get-Content $err }
            throw "the tray app died within 25 seconds of starting"
          }

          $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
          $bmp = New-Object System.Drawing.Bitmap($b.Width, $b.Height)
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.X, $b.Y, 0, 0, $bmp.Size)
          $bmp.Save("$PWD\shots\desktop.png", [System.Drawing.Imaging.ImageFormat]::Png)

          # With no API key configured the app opens Settings on first run, so that window
          # existing is also the check that the settings form builds without throwing.
          $settings = (Get-Process -Id $proc.Id).MainWindowTitle
          Write-Host "main window: '$settings'"
          if ($settings -ne "DoNotType Settings") {
            throw "expected the settings window to open on a first run with no key, got '$settings'"
          }

          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-screenshots
          path: shots/

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3

      # Includes the cross-platform encoder check against eval/conformance/golden.json.
      - name: Unit tests
        working-directory: android
        run: gradle test --no-daemon

      - name: Assemble debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: The shared contract must be inside the APK
        working-directory: android
        run: |
          unzip -p app/build/outputs/apk/debug/app-debug.apk assets/PROMPT.md \
            | grep -q "Context corrects SPELLING, never CONTENT"

      # Window insets only exist once there is a window on a screen, so this class of bug is
      # invisible to every test above. On API 35 the settings screen was drawing underneath the
      # status bar and the keyboard's only button underneath the navigation bar.
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumented UI tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          working-directory: android
          script: gradle connectedDebugAndroidTest --no-daemon

  ios:
    name: iOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the project
        working-directory: ios
        run: xcodegen generate

      # `build` is not evidence that anything works. It passed for the whole life of this project
      # while producing a bundle with no CFBundleIdentifier and no CFBundleExecutable, which no
      # device could install. `test` installs the app in a simulator and drives it, so that class
      # of failure cannot pass again.
      - name: Test app and keyboard extension
        working-directory: ios
        run: |
          xcodebuild test -project DoNotType.xcodeproj -scheme DoNotType \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -configuration Debug CODE_SIGNING_ALLOWED=NO
