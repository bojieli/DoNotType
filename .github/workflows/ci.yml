name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Shell scripts
        run: shellcheck -x scripts/*.sh eval/*.sh

      # actionlint has no first-party action. Download the fixed release archive and verify it
      # before execution so workflow validation does not introduce an unreviewed executable.
      - name: GitHub Actions workflows
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          tool_dir=$(mktemp -d)
          archive="$tool_dir/actionlint.tar.gz"
          curl -fsSL --retry 3 \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            -o "$archive"
          echo "$ACTIONLINT_SHA256  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$tool_dir" actionlint
          "$tool_dir/actionlint" -no-color

      # Exercise every replacement on a disposable CI checkout. This catches a renamed plist key,
      # Gradle field, or CLI version literal before a tag discovers it after the platform builds.
      - name: Release version stamping
        run: |
          ./scripts/stamp-version.sh 9.8.7
          if ./scripts/stamp-version.sh 9.8.100 >/dev/null 2>&1; then
            echo "a colliding version unexpectedly passed validation" >&2
            exit 1
          fi

  # The contract files are copied into every bundle at build time so the platforms cannot drift.
  # This checks the invariant that makes that safe: the shipped prompt must actually build.
  contract:
    name: Contract
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prompt builds for every fidelity
        run: swift test --filter PromptBuilderTests
      # Per-part overrides and the split of the old single-file format, which is the path an
      # existing install takes exactly once and never again.
      - name: Prompt overrides and migration
        run: swift test --filter PromptStoreTests

  swift:
    name: Swift core and macOS app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Unit tests
        # Integration tests are deliberately excluded: they call a paid API and fail when the
        # network does, which would make CI a coin flip rather than a signal.
        run: swift test --filter DoNotTypeCoreTests

      - name: Build the menu-bar app
        run: swift build -c release --product DoNotTypeMac

      # Building it proves nothing about whether it starts — the same reasoning as the Windows job
      # below, which caught an app that had compiled for months and never run. A menu-bar agent
      # cannot be driven by XCUITest, so this checks the bundle, launches the real thing, and reads
      # back the line it logs about itself. See scripts/macos-launch-check.sh.
      - name: Launch the app and check it stays up
        run: |
          make app
          ./scripts/macos-launch-check.sh

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: macos-screenshots
          path: shots/
          if-no-files-found: ignore

      - name: Build the evaluation harness
        run: swift build -c release --product dnt-eval

      - name: Build the CLI
        run: swift build -c release --product dnt

      # Building a command-line tool proves it compiles, not that it runs. This one exercises the
      # path most likely to break silently: finding prompt/, reading every part in it, and
      # writing to stdout rather than stderr. No key and no network.
      - name: Run the CLI
        run: |
          .build/release/dnt prompt validate
          .build/release/dnt providers --no-keychain
          test -n "$(.build/release/dnt prompt show --section summary)"

      # The rolling prerelease is made from the same bundle this job launched and checked. It is
      # deliberately separate from a versioned release, which may also be Developer ID signed and
      # notarized; this is the newest green main build, not a claim that a release was cut.
      - name: Package latest macOS build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p dist
          ditto -c -k --keepParent .build/DoNotType.app dist/DoNotType-macOS.zip
          (cd dist && shasum -a 256 DoNotType-macOS.zip > DoNotType-macOS.zip.sha256)

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: latest-macos
          path: dist/
          overwrite: true

  # The suite this project's claims rest on, re-run for free.
  #
  # It needs a recorded cassette to exist, and recording one costs a single paid run — so this job
  # skips itself until somebody commits one, rather than failing and training people to ignore it.
  # See docs/EVALUATION.md.
  replay:
    name: Replayed eval
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Is there a cassette?
        id: cassette
        run: |
          if [ -f eval/cassettes/nearmiss.json ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No cassette committed yet. Record one with:"
            echo "  swift run dnt-eval suite --record eval/cassettes/nearmiss.json --repeat-count 3"
          fi

      # No key, no network, no cost. This cannot discover anything about a model — it checks that
      # the scoring, the diff classification and the prompt still turn those same answers into the
      # same verdicts.
      - name: Re-score the recorded run
        if: steps.cassette.outputs.found == 'true'
        run: swift run -c release dnt-eval suite --replay eval/cassettes/nearmiss.json

  windows-core:
    name: Windows core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore windows/DoNotType.slnx --locked-mode

      - name: Formatting
        run: dotnet format whitespace windows/DoNotType.slnx --verify-no-changes --no-restore

      # The core deliberately targets plain net10.0 with no Windows TFM, so it builds and tests
      # anywhere. That is what makes this job possible on Linux.
      - name: Core tests
        run: dotnet test windows/DoNotType.Core.Tests/DoNotType.Core.Tests.csproj --no-restore

      # EnableWindowsTargeting lets the tray app and the CLI compile here too, so a change that
      # breaks either is caught on the fast runner rather than on the Windows one.
      - name: Build everything
        run: dotnet build windows/DoNotType.slnx --no-restore

      - name: Run the CLI
        run: |
          dotnet run --project windows/DoNotType.Cli -- prompt validate
          dotnet run --project windows/DoNotType.Cli -- providers --no-stored-key

  windows-app:
    name: Windows app
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      # The same tests the Linux job runs, run again here — because three of them only mean
      # something on Windows. Media Foundation decodes MP3 and M4A through COM interop whose vtable
      # offsets cannot be checked by compiling, and DPAPI cannot be exercised anywhere else. On
      # Linux those tests assert the refusal message instead; this is where they assert the audio.
      - name: Core tests, on Windows
        run: dotnet test windows/DoNotType.Core.Tests/DoNotType.Core.Tests.csproj

      - name: Build the tray app
        run: dotnet build windows/DoNotType.App/DoNotType.App.csproj -c Release

      - name: Build the CLI
        run: dotnet build windows/DoNotType.Cli/DoNotType.Cli.csproj -c Release

      # Publish both executables into one self-contained runtime layout. The release used to put a
      # framework-dependent CLI beside a single-file app, but a single-file app's private runtime
      # cannot satisfy another executable; dnt.exe therefore failed on a clean Windows install.
      - name: Publish the release layout
        shell: powershell
        run: |
          dotnet publish windows/DoNotType.App/DoNotType.App.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=false -o publish
          dotnet publish windows/DoNotType.Cli/DoNotType.Cli.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=false -o publish
          if (!(Test-Path publish/hostfxr.dll)) { throw "the private .NET runtime is missing" }
          if (!(Test-Path publish/dnt.runtimeconfig.json)) { throw "the CLI runtime config is missing" }
          if (!(Test-Path publish/LICENSE.txt)) { throw "the MIT license is missing" }
          if ((Get-Content publish/LICENSE.txt -First 1) -ne "MIT License") {
            throw "the bundled license is not MIT"
          }

      # Media Foundation needs a real Windows session, so this is also the first moment the CLI
      # decodes a compressed recording end to end.
      - name: Decode every format through the CLI
        shell: powershell
        run: |
          $env:DOTNET_ROOT = "$env:RUNNER_TEMP\no-global-dotnet"
          $env:DOTNET_MULTILEVEL_LOOKUP = "0"
          $dnt = "$PWD\publish\dnt.exe"
          & $dnt doctor --no-stored-key
          if ($LASTEXITCODE -ne 0) { throw "dnt doctor reported a problem" }

      # Building a WinForms app proves nothing about whether it starts. This launches the real
      # tray app, waits, and fails if it is not still running -- which covers the tray icon, the
      # global hotkey install, settings load and the first window it opens. Screenshots are
      # uploaded so a person can look at what it actually drew.
      - name: Launch it and check it stays up
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Drawing, System.Windows.Forms
          New-Item -ItemType Directory -Force -Path shots | Out-Null

          $exe = "$PWD\publish\DoNotType.exe"
          $err = "$PWD\shots\stderr.txt"
          $proc = Start-Process $exe -PassThru -RedirectStandardError $err
          Start-Sleep -Seconds 25

          if ($proc.HasExited) {
            Write-Host "exit code $($proc.ExitCode)"
            if (Test-Path $err) { Get-Content $err }
            throw "the tray app died within 25 seconds of starting"
          }

          $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
          $bmp = New-Object System.Drawing.Bitmap($b.Width, $b.Height)
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.X, $b.Y, 0, 0, $bmp.Size)
          $bmp.Save("$PWD\shots\desktop.png", [System.Drawing.Imaging.ImageFormat]::Png)

          # With no API key configured the app opens Settings on first run, so that window
          # existing is also the check that the settings form builds without throwing.
          $settings = (Get-Process -Id $proc.Id).MainWindowTitle
          Write-Host "main window: '$settings'"
          if ($settings -ne "DoNotType Settings") {
            throw "expected the settings window to open on a first run with no key, got '$settings'"
          }

          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue

      # Match the versioned release layout: build the one native dependency from the reviewed
      # source commit, then put it beside both self-contained executables before archiving.
      - name: Build libopus for latest Windows artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: powershell
        run: |
          git clone --depth 1 --branch v1.5.2 https://github.com/xiph/opus.git $env:RUNNER_TEMP/opus
          if ((git -C $env:RUNNER_TEMP/opus rev-parse HEAD) -ne "ddbe48383984d56acd9e1ab6a090c54ca6b735a6") {
            throw "the libopus v1.5.2 tag no longer resolves to the reviewed commit"
          }
          cmake -S $env:RUNNER_TEMP/opus -B $env:RUNNER_TEMP/opus/build `
            -DBUILD_SHARED_LIBS=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build $env:RUNNER_TEMP/opus/build --config Release
          Copy-Item $env:RUNNER_TEMP/opus/build/Release/opus.dll publish/opus.dll

      - name: Package latest Windows build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path publish/* -DestinationPath dist/DoNotType-Windows-x64.zip
          $hash = (Get-FileHash dist/DoNotType-Windows-x64.zip -Algorithm SHA256).Hash.ToLower()
          [System.IO.File]::WriteAllText(
            "$PWD/dist/DoNotType-Windows-x64.zip.sha256",
            "$hash  DoNotType-Windows-x64.zip`n")

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: latest-windows
          path: dist/
          overwrite: true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: windows-screenshots
          path: shots/

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      # Includes the cross-platform encoder check against eval/conformance/golden.json.
      - name: Unit tests
        working-directory: android
        run: ./gradlew test --no-daemon

      - name: Android lint
        working-directory: android
        run: ./gradlew lint --no-daemon

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      # Every part, not just the entry point: a part missing from the APK is invisible until
      # somebody picks that fidelity or style, and then it fails mid-dictation.
      - name: The shared contract must be inside the APK
        working-directory: android
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          unzip -p "$APK" assets/prompt/system.md \
            | grep -q "Context corrects SPELLING, never CONTENT"
          unzip -p "$APK" assets/LICENSE.txt | grep -qx "MIT License"
          for PART in system rewrite summary \
            fidelity/raw fidelity/light fidelity/tidy \
            style/formal style/concise style/casual \
            summary-style/brief summary-style/bullets summary-style/actions; do
            unzip -p "$APK" "assets/prompt/$PART.md" | grep -q . \
              || { echo "assets/prompt/$PART.md is missing or empty"; exit 1; }
          done

      # Window insets only exist once there is a window on a screen, so this class of bug is
      # invisible to every test above. On API 35 the settings screen was drawing underneath the
      # status bar and the keyboard's only button underneath the navigation bar.
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumented UI tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disk-size: 4G
          disable-animations: true
          working-directory: android
          script: ./gradlew connectedDebugAndroidTest --no-daemon

      - name: Package latest Android build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/DoNotType-Android.apk
          (cd dist && sha256sum DoNotType-Android.apk > DoNotType-Android.apk.sha256)

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: latest-android
          path: dist/
          overwrite: true

  ios:
    name: iOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the project
        working-directory: ios
        run: xcodegen generate

      # `build` is not evidence that anything works. It passed for the whole life of this project
      # while producing a bundle with no CFBundleIdentifier and no CFBundleExecutable, which no
      # device could install. `test` installs the app in a simulator and drives it, so that class
      # of failure cannot pass again.
      # Whichever iPhone the image happens to ship. Naming one is how this broke: `iPhone 16`
      # was correct until the runner image moved on, and the failure — "no available devices
      # matched the request" — looks like a broken test rather than a renamed simulator.
      - name: Pick a simulator
        id: simulator
        run: |
          name=$(xcrun simctl list devices available --json \
            | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["name"] for r in sorted(d, reverse=True) for x in d[r] if x["name"].startswith("iPhone")))')
          echo "Using $name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Test app and keyboard extension
        working-directory: ios
        run: |
          mkdir -p ../artifacts
          xcodebuild test -project DoNotType.xcodeproj -scheme DoNotType \
            -destination "platform=iOS Simulator,name=${{ steps.simulator.outputs.name }}" \
            -configuration Debug CODE_SIGNING_ALLOWED=NO \
            -resultBundlePath ../artifacts/ios-tests.xcresult

      # Console output omits the accessibility hierarchy and screenshots that explain most UI-test
      # failures. Keep Xcode's result bundle even on failure so CI is diagnostic, not just red.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: ios-test-results
          path: artifacts/ios-tests.xcresult
          if-no-files-found: warn

  # A moving prerelease is the download surface for the newest fully tested main build. Official
  # v* releases remain tag-driven and immutable; they use the separate release workflow so signing,
  # notarization, version stamping, and a human review still gate anything called stable.
  promote-latest:
    name: Promote latest build
    needs: [hygiene, contract, swift, replay, windows-core, windows-app, android, ios]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: latest-*
          path: dist
          merge-multiple: true

      - name: Verify artifacts
        run: |
          expected=(
            DoNotType-macOS.zip
            DoNotType-macOS.zip.sha256
            DoNotType-Windows-x64.zip
            DoNotType-Windows-x64.zip.sha256
            DoNotType-Android.apk
            DoNotType-Android.apk.sha256
          )
          for asset in "${expected[@]}"; do test -s "dist/$asset"; done
          (cd dist && sha256sum --check ./*.sha256)
          unzip -tq dist/DoNotType-macOS.zip
          unzip -tq dist/DoNotType-Windows-x64.zip
          unzip -tq dist/DoNotType-Android.apk

      - name: Write release notes
        run: |
          cat > latest-notes.md <<EOF
          This rolling prerelease contains the newest **fully green main-branch build**.

          - Commit: [$GITHUB_SHA](https://github.com/$GITHUB_REPOSITORY/commit/$GITHUB_SHA)
          - CI run: [$GITHUB_RUN_ID](https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)
          - Platforms: macOS, Windows x64, Android

          These are development artifacts from CI: macOS is ad-hoc signed, Windows is unsigned,
          and Android uses a debug key. Use a versioned release for stable, reviewed artifacts.
          Verify every download with its adjacent SHA-256 file.
          EOF

      # Replace assets first and move the rolling tag last. A failed upload therefore cannot make
      # an old archive appear to have been built from the new commit.
      - name: Create or update rolling prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest dist/* --clobber
            gh release edit latest \
              --title "Latest successful main build" --prerelease --notes-file latest-notes.md
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/latest" \
              -f sha="$GITHUB_SHA" -F force=true >/dev/null
          else
            gh release create latest dist/* \
              --target "$GITHUB_SHA" --title "Latest successful main build" \
              --prerelease --notes-file latest-notes.md
          fi
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/latest" --jq '.object.sha')" \
            = "$GITHUB_SHA"
