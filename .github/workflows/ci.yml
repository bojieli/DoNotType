name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Shell scripts
        run: shellcheck -x scripts/*.sh eval/*.sh

      - name: Canonical version defaults
        run: ./scripts/check-version.sh

      # actionlint has no first-party action. Download the fixed release archive and verify it
      # before execution so workflow validation does not introduce an unreviewed executable.
      - name: GitHub Actions workflows
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          tool_dir=$(mktemp -d)
          archive="$tool_dir/actionlint.tar.gz"
          curl -fsSL --retry 3 \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            -o "$archive"
          echo "$ACTIONLINT_SHA256  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$tool_dir" actionlint
          "$tool_dir/actionlint" -no-color

      # Exercise every replacement on a disposable CI checkout. This catches a renamed plist key,
      # Gradle field, or CLI version literal before a tag discovers it after the platform builds.
      - name: Release version stamping
        run: |
          ./scripts/stamp-version.sh 9.8.7
          if ./scripts/stamp-version.sh 9.8.100 >/dev/null 2>&1; then
            echo "a colliding version unexpectedly passed validation" >&2
            exit 1
          fi
          # Each of these was typed into the release workflow's version field by someone who
          # expected it to work. The release job runs the stamper once per platform, so a rejected
          # input is the one failure that lands on four runners at once — and it must therefore
          # say what to type instead. Assert the rejection *and* that the message names the
          # accepted spelling, because a bare "invalid" is what sent the last one to be diagnosed
          # as missing signing secrets.
          for bad in 0.2.0-rc1 v0.2.0 1.2 1.2.3.4 01.2.3 1.2.3+build9; do
            if message=$(./scripts/stamp-version.sh "$bad" 2>&1); then
              echo "✗ '$bad' was accepted as a version; it must be rejected" >&2
              exit 1
            fi
            if ! grep -Fq 'three dot-separated numbers' <<< "$message"; then
              echo "✗ rejecting '$bad' did not state the accepted format:" >&2
              printf '%s\n' "$message" >&2
              exit 1
            fi
          done
          # The release workflow greps the built CLI's output for `dnt <version> (`, on both
          # platforms. Stamping a literal that cannot produce that line is invisible until a tag
          # is cut and the signed macOS build fails verification, so assert the stamped spelling
          # here where it costs nothing. A renamed literal fails on this line, not on release day.
          for source in Sources/dnt/Dnt.swift \
                        windows/DoNotType.Cli/Program.cs \
                        windows/DoNotType.Cli/InspectionCommands.cs; do
            if ! grep -qE 'dnt 9\.8\.7 \([0-9a-z]+, [0-9]{4}-[0-9]{2}-[0-9]{2}\)' "$source"; then
              echo "✗ $source was not stamped as 'dnt <version> (<commit>, <date>)':" >&2
              grep -nE 'dnt [0-9]+\.[0-9]+\.[0-9]+|version: "' "$source" >&2 || true
              exit 1
            fi
          done

  # The contract files are copied into every bundle at build time so the platforms cannot drift.
  # This checks the invariant that makes that safe: the shipped prompt must actually build.
  contract:
    name: Contract
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prompt builds for every fidelity
        run: swift test --filter PromptBuilderTests
      # Per-part overrides and the split of the old single-file format, which is the path an
      # existing install takes exactly once and never again.
      - name: Prompt overrides and migration
        run: swift test --filter PromptStoreTests

  swift:
    name: Swift core and macOS app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Unit tests
        # Integration tests are deliberately excluded: they call a paid API and fail when the
        # network does, which would make CI a coin flip rather than a signal.
        run: swift test --filter DoNotTypeCoreTests

      - name: Build the menu-bar app
        run: swift build -c release --product DoNotTypeMac

      # The rolling public download should be usable as an everyday install, not merely prove the
      # source compiles. Only the upstream main push can publish it, so require the same Developer
      # ID and notary groups as a versioned macOS release there. Forks, pull requests and manual CI
      # runs still exercise the app with an ad-hoc signature and never receive these secrets.
      - name: Validate latest macOS signing configuration
        if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          github.repository == 'bojieli/DoNotType'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
        run: |
          missing=()
          for name in MACOS_CERTIFICATE MACOS_CERTIFICATE_PASSWORD \
                      NOTARY_KEY_ID NOTARY_ISSUER_ID NOTARY_KEY; do
            if [[ -z "${!name}" ]]; then missing+=("$name"); fi
          done
          if [[ "${#missing[@]}" -ne 0 ]]; then
            printf 'the public latest macOS build requires %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Import signing certificate for latest macOS build
        if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          github.repository == 'bojieli/DoNotType'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          certificate_path="$RUNNER_TEMP/donottype-latest-cert.p12"
          keychain_path="$RUNNER_TEMP/donottype-latest.keychain-db"
          trap 'rm -f "$certificate_path"' EXIT
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$certificate_path"
          security create-keychain -p runner "$keychain_path"
          security default-keychain -s "$keychain_path"
          security unlock-keychain -p runner "$keychain_path"
          security import "$certificate_path" -k "$keychain_path" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k runner "$keychain_path"

      - name: Build the app bundle
        run: make app

      - name: Verify the app signature
        env:
          OFFICIAL_LATEST: ${{
            github.event_name == 'push' && github.ref == 'refs/heads/main' &&
            github.repository == 'bojieli/DoNotType' }}
        run: |
          codesign --verify --deep --strict --verbose=2 .build/DoNotType.app
          signature=$(codesign -dv --verbose=4 .build/DoNotType.app 2>&1)
          printf '%s\n' "$signature"
          if [[ "$OFFICIAL_LATEST" == "true" ]]; then
            grep -q '^Authority=Developer ID Application:' <<< "$signature"
            grep -q 'flags=.*runtime' <<< "$signature"
          else
            grep -q '^Signature=adhoc$' <<< "$signature"
          fi

      - name: Notarize latest macOS build
        if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          github.repository == 'bojieli/DoNotType'
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
        run: |
          notary_key_path="$RUNNER_TEMP/donottype-latest-notary.p8"
          notary_archive="$RUNNER_TEMP/donottype-latest-notarize.zip"
          trap 'rm -f "$notary_key_path" "$notary_archive"' EXIT
          echo "$NOTARY_KEY" > "$notary_key_path"
          ditto -c -k --keepParent .build/DoNotType.app "$notary_archive"
          xcrun notarytool submit "$notary_archive" \
            --key "$notary_key_path" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" \
            --wait
          xcrun stapler staple .build/DoNotType.app
          xcrun stapler validate .build/DoNotType.app
          spctl --assess --type execute --verbose=4 .build/DoNotType.app

      # Building it proves nothing about whether it starts. A menu-bar agent cannot be driven by
      # XCUITest, so this checks the bundle, launches the real thing, and reads back the line it
      # logs about itself. See scripts/macos-launch-check.sh.
      - name: Launch the app and check it stays up
        run: ./scripts/macos-launch-check.sh

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: macos-screenshots
          path: shots/
          if-no-files-found: ignore

      - name: Build the evaluation harness
        run: swift build -c release --product dnt-eval

      # Run the stored-transcript gate from the binary this job just built. Keeping this beside
      # the app/core build matters on the arm64 hosted runners: a separate `swift run` job used to
      # compile the whole Swift + ONNX graph from a cold checkout, then the runner killed the
      # executable with exit 137 before its first line of output. The check itself needs no model,
      # audio, key, or ONNX inference; reusing the completed build gives it a stable memory ceiling.
      - name: Re-score the committed transcripts
        run: .build/release/dnt-eval rescore

      - name: Build the CLI
        run: swift build -c release --product dnt

      # Building a command-line tool proves it compiles, not that it runs. This one exercises the
      # path most likely to break silently: finding prompt/, reading every part in it, and
      # writing to stdout rather than stderr. No key and no network.
      - name: Run the CLI
        run: |
          .build/release/dnt prompt validate
          .build/release/dnt providers --no-keychain
          test -n "$(.build/release/dnt prompt show --section summary)"
          # `dnt --version` is one line, spelled identically here and on Windows: the version a
          # user pastes into a bug report should not depend on which client they run. It went
          # unchecked once and the two CLIs drifted — Swift printed a bare number because
          # ArgumentParser echoes `configuration.version` verbatim — which only surfaced when a
          # tag reached the release workflow's grep. doctor's header is the same line with a
          # prefix, so it catches a version literal that grew a second `dnt `.
          version_line=$(.build/release/dnt --version)
          if ! grep -qE '^dnt [0-9]+\.[0-9]+\.[0-9]+( \([0-9a-z]+, [0-9]{4}-[0-9]{2}-[0-9]{2}\))?$' \
               <<< "$version_line"; then
            echo "✗ dnt --version printed '$version_line'," >&2
            echo "  expected 'dnt <x.y.z>' with an optional ' (<commit>, <date>)'" >&2
            exit 1
          fi
          doctor_header=$(.build/release/dnt doctor | head -1)
          if [[ "$doctor_header" != "DoNotType — $version_line" ]]; then
            echo "✗ dnt doctor opened with '$doctor_header'," >&2
            echo "  expected 'DoNotType — $version_line'" >&2
            exit 1
          fi

      # The rolling prerelease is made from the exact notarized bundle this job launched and
      # checked. It is still separate from a versioned release: this is the newest green main
      # build, not a claim that a release was cut or reviewed as a stable version.
      - name: Package latest macOS build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p dist
          ditto -c -k --keepParent .build/DoNotType.app dist/DoNotType-macOS.zip
          (cd dist && shasum -a 256 DoNotType-macOS.zip > DoNotType-macOS.zip.sha256)

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: latest-macos
          path: dist/
          overwrite: true

  windows-core:
    name: Windows source validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore windows/DoNotType.slnx --locked-mode

      - name: Formatting
        run: dotnet format whitespace windows/DoNotType.slnx --verify-no-changes --no-restore

      # The core deliberately targets plain net10.0 with no Windows TFM, so it builds and tests
      # anywhere. That is what makes this job possible on Linux.
      - name: Core tests
        run: dotnet test windows/DoNotType.Core.Tests/DoNotType.Core.Tests.csproj --no-restore

      # EnableWindowsTargeting lets the tray app and the CLI compile without creating or packaging
      # a production Windows build. Windows is source-supported but not a release artifact.
      - name: Build everything
        run: dotnet build windows/DoNotType.slnx --no-restore

      - name: Run the CLI
        run: |
          dotnet run --project windows/DoNotType.Cli -- prompt validate
          dotnet run --project windows/DoNotType.Cli -- providers --no-stored-key
          # The same one-line contract the macOS job asserts, checked here so a drift in either
          # direction fails on the platform that caused it.
          version_line=$(dotnet run --project windows/DoNotType.Cli -- --version | tail -1)
          if ! grep -qE '^dnt [0-9]+\.[0-9]+\.[0-9]+( \([0-9a-z]+, [0-9]{4}-[0-9]{2}-[0-9]{2}\))?$' \
               <<< "$version_line"; then
            echo "✗ dnt --version printed '$version_line'," >&2
            echo "  expected 'dnt <x.y.z>' with an optional ' (<commit>, <date>)'" >&2
            exit 1
          fi
          doctor_header=$(dotnet run --project windows/DoNotType.Cli -- doctor | grep -m1 '^DoNotType')
          if [[ "$doctor_header" != "DoNotType — $version_line" ]]; then
            echo "✗ dnt doctor opened with '$doctor_header'," >&2
            echo "  expected 'DoNotType — $version_line'" >&2
            exit 1
          fi

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      # Includes the cross-platform encoder check against eval/conformance/golden.json.
      - name: Unit tests
        working-directory: android
        run: ./gradlew test --no-daemon

      - name: Android lint
        working-directory: android
        run: ./gradlew lint --no-daemon

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      # Every part, not just the entry point: a part missing from the APK is invisible until
      # somebody picks that fidelity or style, and then it fails mid-dictation.
      - name: The shared contract must be inside the APK
        working-directory: android
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          unzip -p "$APK" assets/prompt/system.md \
            | grep -q "Context corrects SPELLING, never CONTENT"
          unzip -p "$APK" assets/LICENSE.txt | grep -qx "MIT License"
          for PART in system rewrite summary \
            fidelity/raw fidelity/light fidelity/tidy \
            style/formal style/concise style/casual \
            summary-style/brief summary-style/bullets summary-style/actions; do
            unzip -p "$APK" "assets/prompt/$PART.md" | grep -q . \
              || { echo "assets/prompt/$PART.md is missing or empty"; exit 1; }
          done

      # Window insets only exist once there is a window on a screen, so this class of bug is
      # invisible to every test above. On API 35 the settings screen was drawing underneath the
      # status bar and the keyboard's only button underneath the navigation bar.
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumented UI tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disk-size: 4G
          disable-animations: true
          working-directory: android
          script: ./gradlew connectedDebugAndroidTest --no-daemon

      - name: Package latest Android build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/DoNotType-Android.apk
          (cd dist && sha256sum DoNotType-Android.apk > DoNotType-Android.apk.sha256)

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: latest-android
          path: dist/
          overwrite: true

  ios:
    name: iOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the project
        working-directory: ios
        run: xcodegen generate

      # `build` is not evidence that anything works. It passed for the whole life of this project
      # while producing a bundle with no CFBundleIdentifier and no CFBundleExecutable, which no
      # device could install. `test` installs the app in a simulator and drives it, so that class
      # of failure cannot pass again.
      # Whichever iPhone the image happens to ship. Naming one is how this broke: `iPhone 16`
      # was correct until the runner image moved on, and the failure — "no available devices
      # matched the request" — looks like a broken test rather than a renamed simulator.
      - name: Pick a simulator
        id: simulator
        run: |
          name=$(xcrun simctl list devices available --json \
            | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["name"] for r in sorted(d, reverse=True) for x in d[r] if x["name"].startswith("iPhone")))')
          echo "Using $name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Test app and keyboard extension
        working-directory: ios
        run: |
          mkdir -p ../artifacts
          xcodebuild test -project DoNotType.xcodeproj -scheme DoNotType \
            -destination "platform=iOS Simulator,name=${{ steps.simulator.outputs.name }}" \
            -configuration Debug CODE_SIGNING_ALLOWED=NO \
            -resultBundlePath ../artifacts/ios-tests.xcresult

      # Console output omits the accessibility hierarchy and screenshots that explain most UI-test
      # failures. Keep Xcode's result bundle even on failure so CI is diagnostic, not just red.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: ios-test-results
          path: artifacts/ios-tests.xcresult
          if-no-files-found: warn

  # A moving prerelease is the download surface for the newest fully tested main build. Official
  # v* releases remain tag-driven and immutable; they use the separate release workflow so signing,
  # notarization, version stamping, and a human review still gate anything called stable.
  promote-latest:
    name: Promote latest build
    needs: [hygiene, contract, swift, windows-core, android, ios]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: latest-*
          path: dist
          merge-multiple: true

      - name: Verify artifacts
        run: |
          expected=(
            DoNotType-macOS.zip
            DoNotType-macOS.zip.sha256
            DoNotType-Android.apk
            DoNotType-Android.apk.sha256
          )
          for asset in "${expected[@]}"; do test -s "dist/$asset"; done
          (cd dist && sha256sum --check ./*.sha256)
          unzip -tq dist/DoNotType-macOS.zip
          unzip -tq dist/DoNotType-Android.apk

      - name: Write release notes
        run: |
          cat > latest-notes.md <<EOF
          This rolling prerelease contains the newest **fully green main-branch build**.

          - Commit: [$GITHUB_SHA](https://github.com/$GITHUB_REPOSITORY/commit/$GITHUB_SHA)
          - CI run: [$GITHUB_RUN_ID](https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)
          - Platforms: macOS, Android

          These are development artifacts from CI. The macOS app is Developer ID signed and
          notarized; Android uses a debug key. Windows is deliberately not distributed because no
          signed production build has been verified. Use a versioned release for stable, reviewed
          artifacts. Verify every download with its adjacent SHA-256 file.
          EOF

      # Replace assets first and move the rolling tag last. A failed upload therefore cannot make
      # an old archive appear to have been built from the new commit.
      - name: Create or update rolling prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            # These assets predate the decision not to distribute an unsigned, unverified Windows
            # production build. Deleting them here prevents a retired file from surviving merely
            # because the current run no longer produces a replacement with the same name.
            gh release delete-asset latest DoNotType-Windows-x64.zip --yes 2>/dev/null || true
            gh release delete-asset latest DoNotType-Windows-x64.zip.sha256 --yes 2>/dev/null || true
            gh release upload latest dist/* --clobber
            gh release edit latest \
              --title "Latest successful main build" --prerelease --notes-file latest-notes.md
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/latest" \
              -f sha="$GITHUB_SHA" -F force=true >/dev/null
          else
            gh release create latest dist/* \
              --target "$GITHUB_SHA" --title "Latest successful main build" \
              --prerelease --notes-file latest-notes.md
          fi
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/latest" --jq '.object.sha')" \
            = "$GITHUB_SHA"
