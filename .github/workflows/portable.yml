name: Portable dictation
on:
  push:
    paths: ['portable/**', 'prompt/**', '.github/workflows/portable.yml']
  pull_request:
    paths: ['portable/**', 'prompt/**', '.github/workflows/portable.yml']
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y alsa-utils
      - run: DNT_ALSA_TEST=1 python3 -m unittest discover -s portable -v
  monterey:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Cross-build for Intel Monterey
        run: |
          portable/macos/build.sh -arch x86_64
          lipo -verify_arch x86_64 portable/macos/record
          vtool -show-build portable/macos/record | grep -E 'minos 12\.0'
      - name: Exercise the host recorder argument checks without opening a microphone
        run: |
          portable/macos/build.sh
          result=0
          portable/macos/record /tmp/unused.wav 0 || result=$?
          test "$result" = 2
      - run: python3 -m unittest discover -s portable -v
