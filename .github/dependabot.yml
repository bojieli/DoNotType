version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: monthly
    groups:
      android-build:
        patterns:
          - "*"

  - package-ecosystem: swift
    directory: /
    schedule:
      interval: monthly
    groups:
      swift-packages:
        patterns:
          - "*"

  - package-ecosystem: nuget
    directory: /windows
    schedule:
      interval: monthly
    groups:
      dotnet-packages:
        patterns:
          - "*"
