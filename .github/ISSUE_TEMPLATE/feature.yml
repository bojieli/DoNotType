name: Propose something
description: A backend, a platform behaviour, a setting.
labels: [proposal]
body:
  - type: markdown
    attributes:
      value: |
        Worth reading first: **[What this will never do](../blob/main/README.md#what-this-will-never-do)**.
        Several obvious-sounding features are deliberate omissions rather than gaps, and the
        reasons are measured ones.

  - type: textarea
    id: problem
    attributes:
      label: What goes wrong today
      description: >
        The situation, not the solution. "I dictate Mandarin and the numbers come out as words" is
        a problem; "add a language dropdown" is a solution that may not be the right one.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you would do about it
    validations:
      required: true

  - type: checkboxes
    id: rules
    attributes:
      label: If this touches transcription quality
      options:
        - label: >
            I understand that a change to `prompt/`, the context format, the budgets or the
            ordering needs before/after numbers from `dnt-eval`, and that a PR with clear
            reasoning and no numbers will be asked for numbers.
