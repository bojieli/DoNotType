# Generated with `xcodegen generate` (see ios/README.md).
#
# Declarative rather than a committed .pbxproj: an app plus an extension plus an App Group is
# exactly the shape that makes a pbxproj unreadable in review, and none of it is interesting.

name: DoNotType
options:
  bundleIdPrefix: app.donottype
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: 5BR9M56H9W
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "100"
    SWIFT_STRICT_CONCURRENCY: complete

packages:
  DoNotTypeCore:
    path: ..

targets:
  # The containing app. It owns the microphone, because a keyboard extension may not have one.
  DoNotType:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
      # The whole directory, as a folder reference: a part is found by its path
      # under prompt/, so a flattened copy would not resolve.
      - path: ../prompt
        buildPhase: resources
        type: folder
      # The installed app carries the same canonical MIT grant as the source checkout.
      - path: ../LICENSE
        buildPhase: resources
      # Translations, if any exist. SwiftUI looks a literal up by its English text, so adding a
      # .lproj here is the whole mechanism — see docs/LOCALIZATION.md.
      - path: ../Resources/Localizations
        buildPhase: resources
        optional: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.donottype
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/DoNotType.entitlements
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # App/Assets.xcassets is picked up by the App source path above. Its one image is rendered
        # from Resources/Icon/DoNotType.svg; iOS derives every other size it needs from that.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: DoNotTypeKeyboard
        embed: true
      - package: DoNotTypeCore
        product: DoNotTypeCore

  # The app/keyboard bridge. A keyboard extension runs in its own process and does not appear in
  # the host app's accessibility tree, so a UI test cannot reach inside it; what it actually does
  # is read a file out of the shared container, and that is testable here.
  DoNotTypeSharedTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SharedTests
    dependencies:
      - target: DoNotType
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.donottype.sharedtests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/DoNotType.app/DoNotType
        BUNDLE_LOADER: $(TEST_HOST)

  # Drives the real app in a simulator. This exists because `xcodebuild build` is not evidence
  # that anything works: it stayed green for the whole life of the project while the bundle it
  # produced had no CFBundleIdentifier and no CFBundleExecutable, so the app could not be
  # installed on any device at all.
  DoNotTypeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: DoNotType
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.donottype.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: DoNotType

  # The keyboard. No microphone, by platform design -- it reads finished transcripts out of the
  # shared container and inserts them.
  DoNotTypeKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: Keyboard
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.donottype.keyboard
        INFOPLIST_FILE: Keyboard/Info.plist
        CODE_SIGN_ENTITLEMENTS: Keyboard/DoNotTypeKeyboard.entitlements
    dependencies:
      - package: DoNotTypeCore
        product: DoNotTypeCore

# Explicit so that `xcodebuild test -scheme DoNotType` runs the UI tests, rather than the UI tests
# living in a scheme nobody invokes.
schemes:
  DoNotType:
    build:
      targets:
        DoNotType: all
        DoNotTypeSharedTests: [test]
        DoNotTypeUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DoNotTypeSharedTests
        - DoNotTypeUITests
